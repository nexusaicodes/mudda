name: mudda

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        RUBY_VERSION: "3.4.8"
    image: mudda-dev
    ports:
      - "${PORT:-3006}:3006"
    environment:
      RAILS_ENV: development
      # The single owner of this deployment. Day-0 sign-in uses MUDDA_OWNER_EMAIL +
      # MUDDA_OWNER_PASSWORD; change these before exposing the app. See DOCKER.md.
      MUDDA_OWNER_EMAIL: "${MUDDA_OWNER_EMAIL:-saksham@nexusai.world}"
      MUDDA_OWNER_NAME: "${MUDDA_OWNER_NAME:-Saksham Saxena}"
      MUDDA_OWNER_LOCALE: "${MUDDA_OWNER_LOCALE:-}"
      MUDDA_OWNER_PASSWORD: "${MUDDA_OWNER_PASSWORD:-mudda-dev-password}"
    volumes:
      # Live code reload: the host checkout is the source of truth at /rails.
      - .:/rails
      # Writable paths kept off the bind mount so the repo stays clean and
      # `docker compose down -v` wipes all state for a truly fresh start.
      - storage:/rails/storage
      - log:/rails/log
      - tmp:/rails/tmp
    # Keep STDIN/TTY open for `binding.irb`/debug and a readable server log.
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3006/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # The browser for system tests (`make test-system`). The dev image has no Chrome, so the
  # tests drive this one over SELENIUM_REMOTE_URL. Started only under the `system` profile, and
  # pinned by digest so a new Chromium release can't change the tests under an unchanged repo.
  selenium:
    image: selenium/standalone-chromium:latest@sha256:3400b92f1cddb2dfaaf358654e8f7d83d7be45192fb73c5f28c25faa28d36504
    profiles: [ system ]
    shm_size: 2gb

volumes:
  storage:
  log:
  tmp:
