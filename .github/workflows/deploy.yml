name: Deploy

# Build the production image, push it to GHCR, then deploy to the box over SSH.
# Runs on pushes to main and on manual dispatch. The deploy job uses the
# `production` GitHub Environment — protect it with required reviewers if you
# want a manual approval gate before anything ships.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: meta
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Render runtime env file
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          APP_HOST: ${{ vars.APP_HOST }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          MUDDA_OWNER_EMAIL: ${{ secrets.MUDDA_OWNER_EMAIL }}
          MUDDA_OWNER_NAME: ${{ secrets.MUDDA_OWNER_NAME }}
          MUDDA_OWNER_PASSWORD: ${{ secrets.MUDDA_OWNER_PASSWORD }}
        run: |
          # printf %s writes each value literally, so a secret containing $()
          # or backticks can't be expanded. Values arrive through the step's env
          # block (not inlined into this script), which avoids shell injection.
          umask 077
          {
            printf 'RAILS_ENV=production\n'
            printf 'IMAGE=%s\n'                "$IMAGE"
            printf 'APP_HOST=%s\n'             "$APP_HOST"
            printf 'BASE_URL=https://%s\n'     "$APP_HOST"
            printf 'ASSUME_SSL=true\n'
            printf 'FORCE_SSL=true\n'
            printf 'SECRET_KEY_BASE=%s\n'      "$SECRET_KEY_BASE"
            printf 'MUDDA_OWNER_EMAIL=%s\n'    "$MUDDA_OWNER_EMAIL"
            printf 'MUDDA_OWNER_NAME=%s\n'     "$MUDDA_OWNER_NAME"
            printf 'MUDDA_OWNER_PASSWORD=%s\n' "$MUDDA_OWNER_PASSWORD"
          } > env.production

      - name: Set up SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY"  > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (from `ssh-keyscan` during box setup) — no trust-on-
          # first-use, so a spoofed box fails the connection instead of deploying.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship assets and deploy
        env:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          ssh_opts="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          target="$SSH_USER@$SSH_HOST"

          # /srv/mudda is owned by the deploy user, so none of this needs sudo.
          ssh $ssh_opts "$target" 'mkdir -p /srv/mudda/deploy'
          scp $ssh_opts docker-compose.prod.yml "$target:/srv/mudda/docker-compose.prod.yml"
          scp $ssh_opts deploy/Caddyfile        "$target:/srv/mudda/deploy/Caddyfile"
          scp $ssh_opts deploy/remote-deploy.sh "$target:/srv/mudda/deploy/remote-deploy.sh"
          # The rendered env (with secrets) rides the encrypted SSH channel into a
          # file the next step locks down to 0600.
          scp $ssh_opts env.production          "$target:/srv/mudda/.env"
          ssh $ssh_opts "$target" \
            'chmod 600 /srv/mudda/.env && chmod +x /srv/mudda/deploy/remote-deploy.sh && bash /srv/mudda/deploy/remote-deploy.sh'
