name: Deploy

# Build the production image, push it to GHCR, then deploy to the EC2 box over
# SSM. Runs on pushes to main and on manual dispatch. The deploy job uses the
# `production` GitHub Environment — protect it with required reviewers if you
# want a manual approval gate before anything ships.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: meta
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read     # box pulls GHCR with this job's GITHUB_TOKEN
      id-token: write     # AWS OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ needs.build.outputs.image }}
          APP_HOST: ${{ vars.APP_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          MUDDA_OWNER_EMAIL: ${{ secrets.MUDDA_OWNER_EMAIL }}
          MUDDA_OWNER_NAME: ${{ secrets.MUDDA_OWNER_NAME }}
          MUDDA_OWNER_PASSWORD: ${{ secrets.MUDDA_OWNER_PASSWORD }}
        run: |
          set -euo pipefail

          # base64 the deploy assets and every secret so the remote shell command
          # carries them intact (base64 has no shell-special characters).
          b64() { printf %s "$1" | base64 -w0; }
          COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)
          CADDY_B64=$(base64 -w0 deploy/Caddyfile)
          SCRIPT_B64=$(base64 -w0 deploy/remote-deploy.sh)

          # Remote script: write deploy assets to /srv/mudda, export values, run it.
          cat > remote-cmd.sh <<REMOTE
          set -eu
          mkdir -p /srv/mudda/deploy /srv/mudda/storage /srv/mudda/caddy/data /srv/mudda/caddy/config
          echo '${COMPOSE_B64}' | base64 -d > /srv/mudda/docker-compose.prod.yml
          echo '${CADDY_B64}'   | base64 -d > /srv/mudda/deploy/Caddyfile
          echo '${SCRIPT_B64}'  | base64 -d > /srv/mudda/deploy/remote-deploy.sh
          chmod +x /srv/mudda/deploy/remote-deploy.sh
          chown -R 1000:1000 /srv/mudda/storage
          export IMAGE='${IMAGE}'
          export APP_HOST='${APP_HOST}'
          export GHCR_USER='${GHCR_USER}'
          export GHCR_TOKEN_B64='$(b64 "$GHCR_TOKEN")'
          export SECRET_KEY_BASE_B64='$(b64 "$SECRET_KEY_BASE")'
          export MUDDA_OWNER_EMAIL_B64='$(b64 "$MUDDA_OWNER_EMAIL")'
          export MUDDA_OWNER_NAME_B64='$(b64 "$MUDDA_OWNER_NAME")'
          export MUDDA_OWNER_PASSWORD_B64='$(b64 "$MUDDA_OWNER_PASSWORD")'
          /srv/mudda/deploy/remote-deploy.sh
          REMOTE

          # Send to the box. --cli-input via a params file avoids quoting issues.
          jq -n --rawfile c remote-cmd.sh '{commands: [$c]}' > ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          # Poll until the command finishes (up to ~10 minutes).
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "--- stderr ---"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          test "$STATUS" = "Success"
