# Every board has the same four fixed lanes (flat kanban). Backlog/Done are
# ordinary columns — there are no lifecycle states.
<% %w[ writebook private miltons_wish_list ].each do |board| %>
<% [ [ "backlog", "Backlog", "var(--color-card-2)" ],
     [ "todo", "Todo", "var(--color-card-3)" ],
     [ "doing", "Doing", "var(--color-card-5)" ],
     [ "done", "Done", "var(--color-card-4)" ] ].each_with_index do |(slug, name, color), position| %>
<%= board %>_<%= slug %>:
  name: <%= name %>
  color: "<%= color %>"
  board: <%= board %>
  position: <%= position %>
<% end %>
<% end %>
