        invalid_code_challenge_method:
          few: يجب أن تكون code_challenge_method إحدى القيم %{challenge_methods}.
          many: يجب أن تكون code_challenge_method إحدى القيم %{challenge_methods}.
          one: يجب أن تكون code_challenge_method هي %{challenge_methods}.
          other: يجب أن تكون code_challenge_method إحدى القيم %{challenge_methods}.
          two: يجب أن تكون code_challenge_method إحدى القيم %{challenge_methods}.
