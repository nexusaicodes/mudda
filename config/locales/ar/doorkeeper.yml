        invalid_redirect_uri: عنوان إعادة التوجيه المطلوب غير صالح أو لا يطابق عنوان
          إعادة التوجيه الخاص بالعميل.
        invalid_request:
          invalid_code_challenge: تحدي الرمز (code challenge) مطلوب.
          missing_param: 'معامل مطلوب مفقود: %{value}.'
          multiple_client_auth_methods: يستخدم الطلب أكثر من طريقة لمصادقة العميل.
          request_not_authorized: يجب تفويض الطلب. المعامل المطلوب لتفويضه مفقود أو
            غير صالح.
          unknown: الطلب ينقصه معامل مطلوب، أو يتضمن قيمة غير مدعومة، أو أنه غير صالح
            لسبب آخر.
        invalid_scope: النطاق المطلوب غير صالح أو غير معروف أو مشوّه.
        invalid_token:
          expired: انتهت صلاحية رمز الوصول
          revoked: تم إلغاء رمز الوصول
          unknown: رمز الوصول غير صالح
        resource_owner_authenticator_not_configured: فشل العثور على مالك المورد لأن
